source:
  type: custom-database
  serviceName: user_updater_demo
  serviceConnection:
    config:
      type: CustomDatabase
      sourcePythonClass: connector.user_updater.UserUpdaterSource
      connectionOptions:
        graphql_endpoint: ${GRAPHQL_ENDPOINT}
  sourceConfig:
    config:
      type: DatabaseMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OPENMETADATA_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_JWT_TOKEN}
