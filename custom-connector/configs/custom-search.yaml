source:
  type: custom-search
  serviceName: custom_search_demo
  serviceConnection:
    config:
      type: CustomSearch
      sourcePythonClass: openmetadata_demo_connectors.search.CustomSearchSource
  sourceConfig:
    config:
      type: SearchMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OPENMETADATA_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_JWT_TOKEN}
