source:
  type: custom-pipeline
  serviceName: custom_pipeline_demo
  serviceConnection:
    config:
      type: CustomPipeline
      sourcePythonClass: openmetadata_demo_connectors.pipeline.CustomPipelineSource
  sourceConfig:
    config:
      type: PipelineMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OPENMETADATA_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_JWT_TOKEN}
