source:
  type: custom-storage
  serviceName: custom_storage_demo
  serviceConnection:
    config:
      type: CustomStorage
      sourcePythonClass: openmetadata_demo_connectors.storage.CustomStorageSource
  sourceConfig:
    config:
      type: StorageMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OPENMETADATA_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_JWT_TOKEN}
