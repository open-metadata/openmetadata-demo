source:
  type: custom-messaging
  serviceName: custom_messaging_demo
  serviceConnection:
    config:
      type: CustomMessaging
      sourcePythonClass: openmetadata_demo_connectors.messaging.CustomMessagingSource
  sourceConfig:
    config:
      type: MessagingMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OPENMETADATA_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_JWT_TOKEN}
